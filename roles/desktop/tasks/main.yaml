---
- name: Install desktop environments
  ansible.builtin.include_tasks:
    file: "{{ item }}_{{ ansible_facts['pkg_mgr'] }}.yaml"
    apply:
      tags: ["{{ item }}"]
  loop: "{{ desktop_envs }}"
  tags: [always]

- name: Configure desktop environments
  ansible.builtin.include_tasks:
    file: "{{ item }}_settings.yaml"
    apply:
      tags: ["{{ item }}"]
  loop: "{{ desktop_envs }}"
  tags: [always]

- name: Replace Firefox snap package
  ansible.builtin.include_tasks:
    file: firefox.yaml
    apply:
      tags: [firefox]
  when: ansible_facts['distribution'] == "Ubuntu"
  tags: [always]

