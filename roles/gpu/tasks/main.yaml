---
- name: Install VirtualGL
  ansible.builtin.include_tasks:
    file: "virtualgl_{{ ansible_facts['pkg_mgr'] }}.yaml"
    apply:
      tags: [virtualgl]
  tags: [always]

- name: Configure VirtualGL
  ansible.builtin.command: /usr/bin/vglserver_config +egl +f
  args:
    creates: /etc/modprobe.d/virtualgl.conf
  tags: [virtualgl]
