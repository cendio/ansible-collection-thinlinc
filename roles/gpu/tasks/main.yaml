---
- name: Install VirtualGL (apt)
  ansible.builtin.include_tasks: virtualgl_apt.yaml
  when: ansible_facts['pkg_mgr'] == "apt"

- name: Install VirtualGL (dnf)
  ansible.builtin.include_tasks: virtualgl_dnf.yaml
  when: ansible_facts['pkg_mgr'] == "dnf"

- name: Configure VirtualGL
  ansible.builtin.command: /usr/bin/vglserver_config +egl +f
  args:
    creates: /etc/modprobe.d/virtualgl.conf
