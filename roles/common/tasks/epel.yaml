---
- name: Enable PowerTools repository (EL < 9)
  community.general.dnf_config_manager:
    name: powertools
    state: enabled
  when:
    - ansible_facts['distribution'] != "Fedora"
    - ansible_facts['distribution'] != "RedHat"
    - ansible_facts['distribution_major_version'] | int < 9

- name: Enable CRB repository (EL >= 9)
  community.general.dnf_config_manager:
    name: crb
    state: enabled
  when:
    - ansible_facts['distribution'] != "Fedora"
    - ansible_facts['distribution'] != "RedHat"
    - ansible_facts['distribution_major_version'] | int >= 9

- name: Enable CodeReady Builder (RHEL)
  community.general.dnf_config_manager:
    name: "codeready-builder-for-rhel-{{ ansible_distribution_major_version }}-x86_64-rpms"
    state: enabled
  when:
    - ansible_facts['distribution'] == "RedHat"

- name: Install EPEL
  ansible.builtin.dnf:
    name:
      - epel-release
  when: ansible_facts['distribution'] != 'Fedora'

- name: Enable EPEL
  community.general.dnf_config_manager:
    name: epel
    state: enabled
  when: ansible_facts['distribution'] != 'Fedora'

- name: Update DNF cache
  ansible.builtin.dnf:
    update_cache: true
